name: Daily AI Pulse

on:
  schedule:
    # Her gün Türkiye saatiyle 12:00'de (09:00 UTC) çalışır
    - cron: '0 9 * * *'
  workflow_dispatch: # GitHub arayüzünden manuel olarak istenildiği an çalıştırma butonu

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Radar Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py

      - name: Commit and Push Daily Pulse
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore(pulse): daily ai radar update for $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
